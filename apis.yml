apis:
- name: Kiwibot Delivery Platform API
  description: >-
    The business-to-business delivery API behind Kiwibot's autonomous last-mile fleet, served from a
    Google Cloud Endpoints gateway at api.kiwibot.com. Probed anonymously on 2026-08-23 the gateway
    answers HTTP 401 UNAUTHENTICATED ("Method doesn't allow unregistered callers ... Please use API
    Key or other form of API consumer identity") on defined resources including /deliveries and
    /zones, and HTTP 404 ("The current request is not defined by this API") on undefined paths — so
    the surface is real and enumerable but entirely credential-gated. No OpenAPI, Swagger, GraphQL
    SDL, AsyncAPI or Postman collection is published at any host we probed, and there is no
    developer portal or public reference; integrators obtain access via the demo/sales form.
  humanURL: https://robot.com/r-kiwi
  baseURL: https://api.kiwibot.com
