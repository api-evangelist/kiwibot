aid: kiwibot
name: Kiwibot
description: >-
  Kiwibot — legally Kiwi Campus, Inc., and rebranded to Robot.com in October 2025 — builds and
  operates fleets of autonomous sidewalk delivery robots, warehouse logistics robots, quadruped and
  humanoid platforms, and robot-mounted advertising units. Founded in Berkeley, California in 2017
  by Felipe Chavez and Jason Oviedo out of a UC Berkeley campus food-delivery pilot, the company
  reports more than 1.7 million completed real-world autonomous tasks for campus dining, retail,
  grocery and enterprise customers across the United States, Canada, Colombia, the United Arab
  Emirates and Saudi Arabia, and acquired mobile-advertising firm Nickelytics in 2023. Its B2B
  delivery platform is exposed as an API-key-gated REST service on a Google Cloud Endpoints gateway
  at api.kiwibot.com — historically integrated by ordering partners such as Shopify and Ordermark —
  but the company publishes no developer portal, no public API reference, and no machine-readable
  contract; access runs through the sales/demo form. Its autonomy team publishes substantial
  first-party open source ROS 2 tooling from the github.com/kiwicampus organization.
