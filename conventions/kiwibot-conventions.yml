  note: >-
    NOT `na` and NOT `documented`. A delivery-dispatch API of this kind almost certainly has a write
    surface with consequential actions (dispatching a robot, cancelling a task), and /deliveries is
    a confirmed defined resource on the gateway — so this is not a read-only API that can honestly
    take `na`. But the provider publishes no reference, so no reversal operation, no operationId,
    and above all NO WINDOW can be cited. Deliberately left ungraded-as-none rather than guessing:
    an invented cancellation window is the one error in this pipeline that could cost a caller real
    money. An agent holding a key today has no published way to learn whether a dispatch it just
    issued can be taken back, or by when.
